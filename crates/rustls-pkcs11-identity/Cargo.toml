[package]
name = "rustls-pkcs11-identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "PKCS#11-backed client identities for rustls"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtrodrigues/uv-pkcs11"
keywords = ["rustls", "pkcs11", "hsm", "mtls"]
categories = ["cryptography", "network-programming"]

[dependencies]
cryptoki = "0.12.0"
rustls = { version = "0.23.36", default-features = false, features = ["std"] }
thiserror = "2.0.0"

[dev-dependencies]
rustls = { version = "0.23.36", default-features = false, features = ["std", "ring"] }
