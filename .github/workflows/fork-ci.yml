# CI for the fork's own changes: the rustls-pkcs11-identity crate and the
# uv-client PKCS#11 integration. Upstream code is covered by upstream CI.
name: "Fork CI"

on:
  push:
    branches: [pkcs11]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build the AWS-LC version pinned in Cargo.lock, not a system installation.
  AWS_LC_SYS_USE_SYSTEM: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install SoftHSM"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends softhsm2

      - name: "Install Rust toolchain"
        # The runner's rustup defaults to the minimal profile, which omits
        # the rustfmt and clippy components.
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy

      - name: "Format"
        run: cargo fmt -p rustls-pkcs11-identity -p uv-client -- --check

      - name: "Clippy"
        run: >-
          cargo clippy --locked -p rustls-pkcs11-identity -p uv-client
          --all-targets -- -D warnings

      # The helper's integration tests provision scratch SoftHSM tokens and
      # complete real client-authenticated handshakes. They skip silently
      # when a tool is missing, so treat any skip as a CI failure.
      - name: "Helper crate tests (SoftHSM)"
        run: |
          cargo test --locked -p rustls-pkcs11-identity -- --nocapture 2>&1 | tee helper-tests.log
          if grep -q "skipping:" helper-tests.log; then
            echo "SoftHSM scenarios were skipped; a required tool is missing" >&2
            exit 1
          fi

      - name: "uv-client unit tests"
        run: cargo test --locked -p uv-client --lib
